<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Uploader</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #111; background: #fff; }
  code { display: block; padding: 12px; background: #f2f2f2; border-radius: 8px; word-break: break-all; font-size: 15px; }
  button { margin-top: 12px; padding: 8px 16px; font-size: 15px; cursor: pointer; }
  .err { color: #b00020; }
  footer { margin-top: 48px; font-size: 14px; color: #666; }
</style>
</head>
<body>
<h1>Clip Uploader</h1>
<p>Clip Uploader is a personal tool that uploads short video clips, chosen by the account owner, to the owner's own TikTok account.</p>
<div id="result"></div>
<footer><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></footer>
<script>
  // TikTok's login sends the user back here with ?code=...&state=... (or ?error=...)
  const q = new URLSearchParams(location.search);
  const box = document.getElementById("result");
  if (q.get("error")) {
    box.innerHTML = '<p class="err">Login was not completed: ' + (q.get("error_description") || q.get("error")).replace(/</g, "&lt;") + '</p>';
  } else if (q.get("code")) {
    box.innerHTML = '<h2>Login code</h2><p>Copy this code back into the uploader on your computer. It expires in a few minutes.</p>' +
      '<code id="c"></code><button id="b">Copy</button>';
    document.getElementById("c").textContent = q.get("code");
    document.getElementById("b").onclick = () => navigator.clipboard.writeText(q.get("code")).then(() => { document.getElementById("b").textContent = "Copied"; });
  }
</script>
</body>
</html>
